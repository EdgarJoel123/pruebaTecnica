<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h1 class="text-center mb-4">Create Invoice</h1>

    <div th:if="${successMessage}" class="alert alert-success" role="alert">
        <span th:text="${successMessage}"></span>
    </div>

    <form th:action="@{/api/invoices}" method="post">
        <div class="mb-3">
            <label for="customer" class="form-label">Customer</label>
            <select id="customer" name="customerId" class="form-select" required>
                <option value="" disabled selected>Select a Customer</option>
                <option th:each="customer : ${customers}"
                        th:value="${customer.customersId}"
                        th:text="${customer.name}"></option>
            </select>
        </div>

        <h3 class="mt-4">Invoice Details</h3>
        <table class="table table-bordered mt-3">
            <thead class="table-light">
            <tr>
                <th>Product</th>
                <th>Unit Price</th>
                <th>Quantity</th>
                <th>Total</th>
            </tr>
            </thead>
            <tbody id="invoice-details">
            <tr>
                <td><input type="text" name="details[0].productName" class="form-control" required></td>
                <td><input type="number" name="details[0].unitPrice" class="form-control" step="0.01" required></td>
                <td><input type="number" name="details[0].quantity" class="form-control" required></td>
                <td><input type="text" name="details[0].total" class="form-control" readonly></td>
            </tr>
            </tbody>
        </table>

        <div class="d-grid">
            <button type="button" id="add-row" class="btn btn-secondary">Add Row</button>
        </div>

        <div class="mt-4">
            <h4>Total Invoice: $<span id="total-invoice">0.00</span></h4>
        </div>

        <div class="d-grid">
            <button type="submit" class="btn btn-success mt-3">Submit Invoice</button>
        </div>
    </form>
</div>

<script>
    document.addEventListener('input', function(event) {
        const tableBody = document.getElementById('invoice-details');
        const rows = tableBody.querySelectorAll('tr');
        let totalInvoice = 0;

        rows.forEach((row, index) => {
            const unitPrice = parseFloat(row.querySelector(`[name="details[${index}].unitPrice"]`).value) || 0;
            const quantity = parseInt(row.querySelector(`[name="details[${index}].quantity"]`).value) || 0;
            const total = unitPrice * quantity;
            row.querySelector(`[name="details[${index}].total"]`).value = total.toFixed(2);
            totalInvoice += total;
        });

        document.getElementById('total-invoice').textContent = totalInvoice.toFixed(2);
    });

    document.getElementById('add-row').addEventListener('click', function () {
        const tableBody = document.getElementById('invoice-details');
        const rowCount = tableBody.children.length;
        const newRow = document.createElement('tr');
        newRow.innerHTML = `
            <td><input type="text" name="details[${rowCount}].productName" class="form-control" required></td>
            <td><input type="number" name="details[${rowCount}].unitPrice" class="form-control" step="0.01" required></td>
            <td><input type="number" name="details[${rowCount}].quantity" class="form-control" required></td>
            <td><input type="text" name="details[${rowCount}].total" class="form-control" readonly></td>
        `;
        tableBody.appendChild(newRow);
    });
</script>
</body>
</html>
